version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart_grievance_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart_grievance_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smart_grievance_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart_grievance_db
      - JWT_ACCESS_SECRET=super_secret_jwt_access_key_dev_2026
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_key_dev_2026
      - AI_PROVIDER=rules
      - STT_PROVIDER=dev
    depends_on:
      - mongodb

volumes:
  mongo_data:
